<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;background:#fff}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{width:120px}.chip{height:72px;border-radius:8px;border:1px solid var(--border-card)}.n{font-size:13px;margin-top:8px;color:var(--text-body)}.v{font-family:var(--font-mono);font-size:11px;color:var(--text-meta);letter-spacing:.28px;text-transform:uppercase}.lbl{font-family:var(--font-mono);font-size:11px;color:var(--text-meta);text-transform:uppercase;letter-spacing:.28px}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--cohere-canvas)"></div><div class="n">Canvas</div><div class="v">#ffffff</div></div><div class="sw"><div class="chip" style="background:var(--cohere-soft-stone)"></div><div class="n">Soft Stone</div><div class="v">#eeece7</div></div><div class="sw"><div class="chip" style="background:var(--cohere-pale-green)"></div><div class="n">Pale Green</div><div class="v">#edfce9</div></div><div class="sw"><div class="chip" style="background:var(--cohere-pale-blue)"></div><div class="n">Pale Blue</div><div class="v">#f1f5ff</div></div></div></body></html>
