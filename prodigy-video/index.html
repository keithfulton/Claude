<!doctype html><html><head><meta charset="utf-8">
<link href="fonts/fonts.css" rel="stylesheet">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const W=1920,H=1080,FPS=30,DUR=18;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const C={ink:'#16191D',lime:'#F3F4F1',fog:'#D5DAD6',muted:'#5C6460',cob:'#1F3DBE',cobHi:'#4A67FF',press:'#152B8A',dusk:'#1A2A5C',tung:'#F2C98A',white:'#FFFFFF'};
const F={d:'"Bricolage Grotesque"',b:'"Inter Tight"',m:'"JetBrains Mono"'};
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),lerp=(a,b,t)=>a+(b-a)*t,P=(t,a,b)=>cl((t-a)/(b-a));
const eOut=t=>t>=1?1:1-Math.pow(2,-10*t),eIn=t=>t<=0?0:Math.pow(2,10*t-10);
const eIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,q3=t=>1-Math.pow(1-t,3);
const eBack=t=>{t=cl(t);const c1=1.9,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const hs=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};

/* ---------- assets ---------- */
const cache=new Map();let pending=[],FRAME=0;
function img(src){let e=cache.get(src);if(!e){const im=new Image();e={im,ok:false,fail:false};cache.set(src,e);
 e.p=new Promise(r=>{im.onload=()=>{e.ok=true;r()};im.onerror=()=>{e.fail=true;r()}});im.src=src}
 e.last=FRAME;if(!e.ok&&!e.fail)pending.push(e.p);return e.ok?e.im:null}
function evict(){for(const[k,e]of cache)if(k.startsWith('frames/')&&FRAME-e.last>6){e.im.src='';cache.delete(k)}}
const A=s=>img('assets/'+s);
const tints=new Map();
function tint(src,col){const k=src+col;if(tints.has(k))return tints.get(k);const im=A(src);if(!im)return null;
 const c=document.createElement('canvas');c.width=im.width;c.height=im.height;const g=c.getContext('2d');
 g.drawImage(im,0,0);g.globalCompositeOperation='source-in';g.fillStyle=col;g.fillRect(0,0,c.width,c.height);tints.set(k,c);return c}
function foot(k,ft){const i=cl(Math.floor(ft*30),0,89);return img(`frames/s${k}/${String(i+1).padStart(4,'0')}.jpg`)}
function placeholder(k,x,y,w,h){const g=ctx.createLinearGradient(0,y,0,y+h);
 const pal=[['#E2E4EE','#BBBFC8','#5E6943'],['#E0E2EA','#B8BCC4','#5B6640'],['#D9D2D4','#A89F98','#5F6645'],['#E7B27A','#9A6A50','#3A3020'],['#2B3470','#6E5A70','#2A2418']][k];
 g.addColorStop(0,pal[0]);g.addColorStop(.55,pal[1]);g.addColorStop(.6,pal[2]);g.addColorStop(1,pal[2]);ctx.fillStyle=g;ctx.fillRect(x,y,w,h);
 ctx.fillStyle=k==4?'#F2C98A':'#fff';ctx.beginPath();ctx.moveTo(x+w*.35,y+h*.62);ctx.lineTo(x+w*.42,y+h*.4);ctx.lineTo(x+w*.58,y+h*.4);ctx.lineTo(x+w*.65,y+h*.62);ctx.fill()}
function cover(im,x,y,w,h,z=1,fx=.5,fy=.5,k=0){if(!im){ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();placeholder(k,x,y,w,h);ctx.restore();return}
 const s=Math.max(w/im.width,h/im.height)*z,dw=im.width*s,dh=im.height*s;ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();
 ctx.drawImage(im,x+(w-dw)*fx,y+(h-dh)*fy,dw,dh);ctx.restore()}
function contain(im,x,y,w,h){if(!im){ctx.fillStyle=C.fog;ctx.fillRect(x+w*.2,y+h*.2,w*.6,h*.6);return}
 const s=Math.min(w/im.width,h/im.height),dw=im.width*s,dh=im.height*s;ctx.drawImage(im,x+(w-dw)/2,y+(h-dh)/2,dw,dh)}

/* ---------- text ---------- */
function setF(o){const sz=o.sz||100,fam=o.fam||F.d;ctx.font=`${o.w||800} ${sz}px ${fam}`;ctx.letterSpacing=(o.ls??(fam===F.d?-0.03*sz:0))+'px';ctx.textAlign=o.al||'left';ctx.textBaseline='alphabetic'}
function MW(s,o){setF(o);const w=ctx.measureText(s).width;ctx.letterSpacing='0px';return w}
function T(s,x,y,o){setF(o);if(o.stroke){ctx.lineWidth=o.stroke;ctx.strokeStyle=o.col||'#fff';ctx.strokeText(s,x,y)}else{ctx.fillStyle=o.col||'#fff';ctx.fillText(s,x,y)}ctx.letterSpacing='0px'}
function x0of(s,x,o){const w=MW(s,o);return o.al==='center'?x-w/2:o.al==='right'?x-w:x}
function rise(s,x,y,o,p){if(p<=0)return;const sz=o.sz||100,w=MW(s,o),x0=x0of(s,x,o);ctx.save();ctx.beginPath();ctx.rect(x0-sz*.3,y-sz*1.02,w+sz*.6,sz*1.3);ctx.clip();T(s,x,y+(1-eOut(p))*sz*1.2,o);ctx.restore()}
function typeOn(s,x,y,o,p,cur=true){if(p<=0)return;const n=Math.floor(s.length*cl(p)+.001);T(s.slice(0,n),x,y,o);
 if(cur&&p<1){const w=MW(s.slice(0,n),o),sz=o.sz||20;ctx.fillStyle=o.col||'#fff';ctx.fillRect(x0of(s.slice(0,n),x,o)+w+4,y-sz*.8,sz*.55,sz*.95)}}
function chars(s,x,y,o,fn){setF(o);const x0=x0of(s,x,o);let acc='';ctx.textAlign='left';
 for(let i=0;i<s.length;i++){const cx=x0+MW(acc,{...o,al:'left'});acc+=s[i];const cw=MW(s[i],{...o,al:'left'});
  ctx.save();ctx.translate(cx+cw/2,y);fn(i,s.length);T(s[i],-cw/2,0,{...o,al:'left'});ctx.restore()}}
function roll(v,x,y,o,cols){const sz=o.sz,cw=o.cw||sz*.6,lh=sz*1.1;ctx.save();ctx.beginPath();ctx.rect(x-cw*cols-20,y-sz*.95,cw*cols+40,sz*1.2);ctx.clip();
 for(let k=0;k<cols;k++){const cx=x-cw*(k+.5),d=Math.floor(v/10**k)%10;const fr=k==0?v%1:Math.max(0,(v/10**(k-1))%10-9);
  const sig=k==0||Math.floor(v+fr*0)>=10**k;
  for(const[dd,off]of[[d,0],[(d+1)%10,lh]]){const yy=y-fr*lh+off;const s2=Math.floor(v)>=10**k||(dd>0&&off>0&&fr>0);
   if(sig||s2)T(String(dd),cx,yy,{...o,al:'center',ls:0});else T(String(dd),cx,yy,{...o,al:'center',ls:0,stroke:3})}}
 ctx.restore()}
function box(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(x,y,w,h)}

/* ---------- particles ---------- */
let PT_MARK=[],PT_LOGO=[];
function samplePts(im,w,cx,cy,n,fb){const h=im?Math.round(w*im.height/im.width):Math.round(w*.3);const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
 if(im)g.drawImage(im,0,0,w,h);else{g.font=`800 ${h*.8}px ${F.d}`;g.textAlign='center';g.textBaseline='middle';g.fillStyle='#fff';g.fillText(fb,w/2,h/2)}
 const d=g.getImageData(0,0,w,h).data,pts=[];for(let y=0;y<h;y+=2)for(let x=0;x<w;x+=2)if(d[(y*w+x)*4+3]>140)pts.push([cx-w/2+x,cy-h/2+y]);
 for(let i=pts.length-1;i>0;i--){const j=Math.floor(hs(i*3.7)*(i+1));[pts[i],pts[j]]=[pts[j],pts[i]]}
 const out=[];for(let i=0;i<n;i++)out.push(pts[i%Math.max(1,pts.length)]||[cx,cy]);return out}
function dust(t,n,seed,col,a,rmin,rmax,vx,vy,mode='screen'){ctx.save();ctx.globalCompositeOperation=mode;
 for(let i=0;i<n;i++){const h1=hs(seed+i),h2=hs(seed+i*1.3+5),h3=hs(seed+i*2.1+9),h4=hs(seed+i*.7+2);
  let x=(h1*W+t*vx*(.5+h3))%(W+200);if(x<0)x+=W+200;x-=100;let y=(h2*H+t*vy*(.5+h4))%(H+200);if(y<0)y+=H+200;y-=100;
  x+=Math.sin(t*1.3+i)*14;const r=lerp(rmin,rmax,h3);const g=ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');ctx.globalAlpha=a*(.4+.6*h4);ctx.fillStyle=g;ctx.fillRect(x-r,y-r,2*r,2*r)}ctx.restore()}

/* ---------- global fx ---------- */
let GRAIN=[],VIG;
function initFx(){let sd=12345;const rnd=()=>{sd^=sd<<13;sd>>>=0;sd^=sd>>17;sd^=sd<<5;sd>>>=0;return sd/4294967296};for(let k=0;k<4;k++){const c=document.createElement('canvas');c.width=960;c.height=540;const g=c.getContext('2d'),id=g.createImageData(960,540);
 for(let i=0;i<id.data.length;i+=4){const v=rnd()*255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255}g.putImageData(id,0,0);GRAIN.push(c)}
 VIG=document.createElement('canvas');VIG.width=W;VIG.height=H;const g=VIG.getContext('2d');const r=g.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*1.05);
 r.addColorStop(0,'rgba(0,0,0,0)');r.addColorStop(1,'rgba(0,0,0,.45)');g.fillStyle=r;g.fillRect(0,0,W,H)}
const IMPACTS=[[2,9],[4,7],[6,7],[8,7],[10,8],[12,7],[14,6],[16,14]];
function shake(t){let x=0,y=0;for(const[ti,a]of IMPACTS){const d=t-ti;if(d>=0&&d<.4){const e=a*Math.exp(-d*14);x+=e*Math.sin(d*83);y+=e*Math.cos(d*67)}}return[x,y]}
const beat=t=>t>=2&&t<14?Math.exp(-((t-2)%.5)*9):0;

/* ---------- scenes (lt = local time, 0..2) ---------- */
function intro(lt){box(0,0,W,H,C.ink);
 const gl=ctx.createRadialGradient(960,450,0,960,450,1000);gl.addColorStop(0,`rgba(31,61,190,${.18+.4*P(lt,0,1.3)})`);gl.addColorStop(1,'rgba(22,25,29,0)');ctx.fillStyle=gl;ctx.fillRect(0,0,W,H);
 // drafting lines
 ctx.save();ctx.strokeStyle='rgba(255,255,255,.08)';ctx.lineWidth=1;for(let x=0;x<=W;x+=80){ctx.globalAlpha=P(lt,x/W*.5,x/W*.5+.4);ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
 for(let y=0;y<=H;y+=80){ctx.globalAlpha=P(lt,y/H*.5,y/H*.5+.4);ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.restore();
 const cp=eOut(P(lt,0,.7));ctx.strokeStyle='rgba(74,103,255,.7)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(960-960*cp,450);ctx.lineTo(960+960*cp,450);ctx.moveTo(960,450-540*cp);ctx.lineTo(960,450+630*cp);ctx.globalAlpha=1-P(lt,1.1,1.4);ctx.stroke();ctx.globalAlpha=1;
 // particles converging to the mark
 const fade=1-P(lt,1.35,1.7);if(fade>0){ctx.save();ctx.globalCompositeOperation='lighter';
  const pos=(i,tt)=>{const[tx,ty]=PT_MARK[i];const d=hs(i*1.7)*.4,p=eIO(P(tt,.02+d,.02+d+1.0));const a=hs(i)*6.283,r0=500+hs(i*2.3)*900;
   const sw=(1-p)*(hs(i*4.1)-.5)*5;const sx=960+Math.cos(a+sw)*r0*(1-p*.3),sy=450+Math.sin(a+sw)*r0*(1-p*.3);return[lerp(sx,tx,p),lerp(sy,ty,p),p]};
  ctx.lineWidth=1.6;ctx.strokeStyle=`rgba(140,160,255,${.55*fade})`;ctx.beginPath();
  for(let i=0;i<PT_MARK.length;i+=2){const[a,b]=pos(i,lt),[c,d]=pos(i,lt-.035);ctx.moveTo(c,d);ctx.lineTo(a,b)}ctx.stroke();
  for(let i=0;i<PT_MARK.length;i++){const[x,y,p]=pos(i,lt);const s=1.4+hs(i*9.1)*2.2;ctx.fillStyle=i%5?`rgba(255,255,255,${(.35+.65*p)*fade})`:`rgba(242,201,138,${(.4+.6*p)*fade})`;ctx.fillRect(x-s/2,y-s/2,s,s)}ctx.restore()}
 const mk=tint('brand/mark-ink.png','#fff');const ma=P(lt,1.22,1.45);if(ma>0){ctx.globalAlpha=ma;const sc=1+.04*(1-eOut(P(lt,1.22,1.8)));
  if(mk){const w=760*sc,h=w*mk.height/mk.width;ctx.drawImage(mk,960-w/2,450-h/2,w,h)}else T('PRODIGY',960,500,{sz:160,al:'center'});ctx.globalAlpha=1}
 const rp=P(lt,1.3,1.95);if(rp>0&&rp<1){ctx.strokeStyle=`rgba(255,255,255,${.7*(1-rp)})`;ctx.lineWidth=3;ctx.beginPath();ctx.arc(960,450,80+eOut(rp)*1000,0,7);ctx.stroke()}
 const fl=Math.exp(-Math.max(0,lt-1.3)*14)*(lt>1.3);if(fl>.01){ctx.fillStyle=`rgba(255,255,255,${fl*.35})`;ctx.fillRect(0,0,W,H)}
 chars('THE PRODIGY RENTALS',960,715,{sz:46,w:600,fam:F.b,ls:20,al:'center',col:'#fff'},(i)=>{const p=eOut(P(lt,1.3+i*.022,1.3+i*.022+.4));ctx.globalAlpha=p;ctx.translate(0,(1-p)*40)});ctx.globalAlpha=1;
 const up=eOut(P(lt,1.45,1.85));box(960-260*up,748,520*up,5,C.cobHi);
 ctx.globalAlpha=P(lt,1.55,1.8);T('PARTY & EVENT RENTALS  —  SEASIDE, CA',960,800,{sz:20,w:500,fam:F.m,ls:5,al:'center',col:C.tung});ctx.globalAlpha=1}

function words(lt){const im=foot(0,.2+(lt+.3)*1.05);cover(im,0,0,W,H,1.06+.07*P(lt,-.3,2.3),.5,.55,0);
 let g=ctx.createLinearGradient(0,0,1300,0);g.addColorStop(0,'rgba(22,25,29,.82)');g.addColorStop(1,'rgba(22,25,29,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 dust(lt+2,26,11,'rgba(255,255,255,1)',.10,30,110,40,-6);
 typeOn('01 — THE SETUP · MONTEREY COUNTY',140,210,{sz:22,w:500,fam:F.m,ls:4,col:C.tung},P(lt,.12,.6));
 const L=[['TENTS.',.12,370],['TABLES.',.5,530],['CHAIRS.',1.0,690]];
 L.forEach(([s,t0,y],i)=>{const nxt=L[i+1]?L[i+1][1]:9;const op=P(lt,nxt,nxt+.18);const p=P(lt,t0,t0+.38);
  if(op<1)rise(s,140,y,{sz:170,col:`rgba(255,255,255,${1-op})`},p);if(op>0){ctx.globalAlpha=op;T(s,140,y,{sz:170,stroke:2.5,col:'rgba(255,255,255,.85)'});ctx.globalAlpha=1}});
 const ai=lt<.5?0:lt<1?1:2;const by=[370,530,690][ai]-150+(1-eOut(P(lt,[.12,.5,1][ai],[.12,.5,1][ai]+.3)))*-60;if(lt>.12){box(100,by,18,110,C.cobHi)}
 const bp=eOut(P(lt,1.45,1.75));if(bp>0){const s='DELIVERED + SET UP',o={sz:78,col:'#fff'},w=MW(s,o)+56;box(130,760,w*bp,104,C.cob);
  ctx.save();ctx.beginPath();ctx.rect(130,760,w*bp,104);ctx.clip();T(s,158,840,o);ctx.restore();box(130+w*bp-6,760,6,104,C.tung)}}

const PIN=[1320,560],RAD=mi=>150*Math.log(1+mi/2);
const TOWNS=[['MARINA',2.8,4.8,.55],['SALINAS',10.5,4.8,.62],['MONTEREY',-2.2,-.7,.69],['PACIFIC GROVE',-3.9,.7,.76],['CARMEL',-3.9,-4.1,.83]];
const tpos=([,e,n])=>{const d=Math.hypot(e,n),r=RAD(d);return[PIN[0]+e/d*r,PIN[1]-n/d*r]};
const COAST=[[-150,-600],[-40,-330],[75,-190],[40,-100],[-22,-30],[-60,12],[-120,8],[-195,-45],[-212,15],[-172,120],[-175,165],[-200,320],[-270,600]];
function coastPts(){const o=[];for(let i=0;i<COAST.length-1;i++){const p0=COAST[Math.max(0,i-1)],p1=COAST[i],p2=COAST[i+1],p3=COAST[Math.min(COAST.length-1,i+2)];
 for(let s=0;s<16;s++){const t=s/16,t2=t*t,t3=t2*t;o.push([0,1].map(k=>.5*((2*p1[k])+(-p0[k]+p2[k])*t+(2*p0[k]-5*p1[k]+4*p2[k]-p3[k])*t2+(-p0[k]+3*p1[k]-3*p2[k]+p3[k])*t3)))}}o.push(COAST[COAST.length-1]);return o.map(([x,y])=>[x+PIN[0],y+PIN[1]])}
let CP=null;
function mapS(lt){box(0,0,W,H,C.lime);if(!CP)CP=coastPts();
 ctx.save();ctx.strokeStyle='rgba(22,25,29,.07)';ctx.lineWidth=1;const off=(lt*12)%60;ctx.beginPath();for(let x=-off;x<W;x+=60){ctx.moveTo(x,0);ctx.lineTo(x,H)}for(let y=0;y<H;y+=60){ctx.moveTo(0,y);ctx.lineTo(W,y)}ctx.stroke();ctx.restore();
 const R60=RAD(60),R10=RAD(10);
 // service-area scope
 const sp=eOut(P(lt,.05,.8));ctx.save();ctx.beginPath();ctx.arc(PIN[0],PIN[1],R60*sp,0,7);ctx.clip();box(0,0,W,H,'#EAECE8');
 ctx.beginPath();ctx.moveTo(CP[0][0],CP[0][1]);CP.forEach(p=>ctx.lineTo(p[0],p[1]));ctx.lineTo(0,H+50);ctx.lineTo(0,-50);ctx.closePath();ctx.fillStyle='rgba(31,61,190,.10)';ctx.fill();
 ctx.save();ctx.clip();ctx.strokeStyle='rgba(31,61,190,.22)';ctx.lineWidth=1.5;ctx.beginPath();for(let y=0;y<H;y+=12){ctx.moveTo(0,y+Math.sin(y)*2);ctx.lineTo(W,y)}ctx.stroke();ctx.restore();
 // radar sweep
 const ra=lt*3.2-1.6;const rg=ctx.createConicGradient(ra,PIN[0],PIN[1]);rg.addColorStop(0,'rgba(31,61,190,.20)');rg.addColorStop(.12,'rgba(31,61,190,0)');rg.addColorStop(1,'rgba(31,61,190,0)');ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);ctx.restore();
 // coastline draw-on
 const cp=eIO(P(lt,.1,1.0));ctx.save();ctx.beginPath();ctx.arc(PIN[0],PIN[1],R60*sp+2,0,7);ctx.clip();ctx.strokeStyle=C.ink;ctx.lineWidth=3;ctx.beginPath();const nn=Math.floor(CP.length*cp);CP.slice(0,nn).forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();ctx.restore();
 // rings
 const r1=eOut(P(lt,.45,1.0)),r2=eOut(P(lt,.6,1.3));ctx.lineWidth=3;ctx.strokeStyle=C.cob;ctx.beginPath();ctx.arc(PIN[0],PIN[1],R10,-Math.PI/2,-Math.PI/2+6.2832*r1);ctx.stroke();
 ctx.setLineDash([12,9]);ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(PIN[0],PIN[1],R60,-Math.PI/2,-Math.PI/2+6.2832*r2);ctx.stroke();ctx.setLineDash([]);
 const tag=(s,a,r,t0)=>{const p=eBack(P(lt,t0,t0+.3));if(p<=0)return;const x=PIN[0]+Math.cos(a)*r,y=PIN[1]+Math.sin(a)*r;ctx.save();ctx.translate(x,y);ctx.scale(p,p);const w=MW(s,{sz:20,w:700,fam:F.m})+24;box(-w/2,-17,w,34,C.cob);T(s,0,7,{sz:20,w:700,fam:F.m,al:'center',col:'#fff'});ctx.restore()};
 // routes + towns
 TOWNS.forEach((tw,i)=>{const[x,y]=tpos(tw),t0=tw[3];const rp=eIO(P(lt,t0,t0+.45));if(rp>0){const mx=(x+PIN[0])/2+(y-PIN[1])*.25,my=(y+PIN[1])/2-(x-PIN[0])*.25;
  ctx.strokeStyle=C.cob;ctx.lineWidth=2.5;ctx.setLineDash([7,6]);ctx.beginPath();for(let s=0;s<=20*rp;s++){const u=s/20,a=(1-u)*(1-u),b=2*u*(1-u),c=u*u;const px=a*PIN[0]+b*mx+c*x,py=a*PIN[1]+b*my+c*y;s?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.stroke();ctx.setLineDash([])}
  const dp=eBack(P(lt,t0+.3,t0+.55));if(dp>0){ctx.fillStyle=C.ink;ctx.beginPath();ctx.arc(x,y,8*dp,0,7);ctx.fill();ctx.globalAlpha=cl(dp);const right=x>=PIN[0]-20&&tw[0]!=='MONTEREY';
   T(tw[0],x+(right?18:-18),y+8,{sz:22,w:700,fam:F.b,ls:2,col:C.ink,al:right?'left':'right'});ctx.globalAlpha=1}});
 tag('10 MI',2.0,R10,1.0);tag('60 MI',-.9,R60,1.3);
